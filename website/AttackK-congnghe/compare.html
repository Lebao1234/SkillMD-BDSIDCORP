<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="cmp.title">So sanh san pham | HADAL</title>
<meta name="description" data-i18n-content="cmp.desc" content="Dat canh nhau toi da bon san pham HADAL de doi chieu trong luong, cam bien, DPI, polling rate va gia.">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/pages.css">

<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('as.theme'));
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="g.skip">Bo qua, di thang toi noi dung</a>
<div data-site-header></div>

<main id="main">

  <section class="pagehead">
    <div class="wrap pagehead__inner">
      <nav aria-label="Duong dan">
        <ol class="crumbs">
          <li><a href="index.html" data-i18n="g.home">Trang chu</a></li>
          <li><span aria-current="page" data-i18n="pdp.compare">So sanh</span></li>
        </ol>
      </nav>
      <h1 class="pagehead__title" data-i18n="cmp.h1">So sanh san pham</h1>
      <div class="row row--between row--wrap">
        <p class="muted" data-compare-count></p>
        <button type="button" class="btn btn--secondary btn--sm" data-compare-clear data-i18n="cmp.clear">Xoa bang so sanh</button>
      </div>
    </div>
  </section>

  <section class="section section--tight">
    <div class="wrap">
      <div data-compare-empty hidden></div>
      <div class="comparewrap" data-compare-table hidden></div>
    </div>
  </section>

  <section class="section section--tight" aria-labelledby="cmp-sug-h">
    <div class="wrap">
      <div class="section-head">
        <div class="section-head__text">
          <h2 class="section-head__title" id="cmp-sug-h" style="font-size:var(--fs-3xl)" data-i18n="cmp.suggest.title">Them vao bang so sanh</h2>
          <p class="muted" data-i18n="cmp.suggest.text">Cac model cung phan khuc.</p>
        </div>
      </div>
      <div class="grid-products grid-products--4" data-compare-suggest></div>
    </div>
  </section>

</main>

<div data-site-footer></div>

<script src="assets/data/products.js"></script>
<script src="assets/data/reviews.js"></script>
