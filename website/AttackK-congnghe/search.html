<!DOCTYPE html>
<html lang="vi" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="sp.title">Tim kiem | HADAL</title>
<meta name="description" data-i18n-content="sp.desc" content="Tim chuot, ban phim, tai nghe va phu kien HADAL theo ten, cam bien hoac thong so.">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.shopify.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/pages.css">

<script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('as.theme'));
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="g.skip">Bo qua, di thang toi noi dung</a>
<div data-site-header></div>

<main id="main">

  <section class="pagehead">
    <div class="wrap pagehead__inner">
      <nav aria-label="Duong dan">
        <ol class="crumbs">
          <li><a href="index.html" data-i18n="g.home">Trang chu</a></li>
          <li><span aria-current="page" data-i18n="search.title">Tim kiem</span></li>
        </ol>
      </nav>
      <h1 class="pagehead__title"><span data-i18n="sp.h1">Ket qua cho</span> <span data-search-term class="accent-text"></span></h1>

      <form class="searchbox__field" style="max-width:720px" data-search-form role="search">
        <span class="searchbox__icon"><i class="ph-light ph-magnifying-glass" aria-hidden="true"></i></span>
        <label class="visually-hidden" for="page-search" data-i18n="sp.term">Tu khoa tim kiem</label>
        <input class="searchbox__input" id="page-search" type="search" data-i18n-placeholder="sp.placeholder" placeholder="Nhap ten san pham hoac thong so" data-search-q autocomplete="off">
        <button class="btn btn--primary" type="submit" data-i18n="sp.go">Tim</button>
      </form>
    </div>
  </section>

  <section class="section section--tight">
    <div class="wrap">
      <div class="toolbar">
        <div class="toolbar__left">
          <p class="resultcount" data-search-count aria-live="polite"></p>
        </div>
        <div class="row">
          <label class="text-sm dim" for="search-sort" data-i18n="g.sortBy">Sap xep</label>
          <select class="select" id="search-sort" data-search-sort style="min-height:38px;padding-block:var(--space-2)"></select>
        </div>
      </div>

      <div class="activefilters" data-search-groups></div>

      <div class="grid-products grid-products--4" data-search-grid></div>

      <div data-search-empty hidden>
        <div class="empty">
          <span class="empty__icon"><i class="ph-light ph-magnifying-glass" aria-hidden="true"></i></span>
          <h2 class="empty__title" data-i18n="search.noResults">Khong tim thay ket qua</h2>
          <p class="empty__text" data-i18n="sp.empty.text">Thu tu khoa ngan hon.</p>
          <a class="btn btn--secondary btn--lg" href="collection.html?c=shop-all" data-i18n="search.browseAll">Xem toan bo san pham</a>
        </div>
        <div class="grid-products grid-products--4" data-search-fallback style="margin-block-start:var(--space-9)"></div>
      </div>
    </div>
  </section>

</main>

<div data-site-footer></div>

<script src="assets/data/products.js"></script>
<script src="assets/data/reviews.js"></script>
<script src="assets/data/posts.js"></script>
<script src="assets/js/brand.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/i18n-content.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/search.js"></script>
</body>
</html>
