    <section class="page-head">
      <div class="container">
        {{crumbs}}
        <h1>Ghé xưởng hoặc <em>gửi file trực tuyến</em></h1>
        <p class="lead">Mở cửa 8:00-18:00 từ Thứ 2 đến Thứ 7. Mang vật mẫu đến để scan hoặc xem trực tiếp các mẫu vật liệu.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="contact-row">
          <a class="contact-item" href="tel:{{hotline-tel}}"><i class="ph ph-phone" aria-hidden="true"></i><span>Hotline</span><strong>{{hotline}}</strong></a>
          <a class="contact-item" href="{{zalo}}" target="_blank" rel="noopener"><i class="ph ph-chat-circle-dots" aria-hidden="true"></i><span>Zalo, gửi file nhanh nhất</span><strong>{{hotline}}</strong></a>
          <a class="contact-item" href="mailto:{{email}}"><i class="ph ph-envelope-simple" aria-hidden="true"></i><span>Email</span><strong>{{email}}</strong></a>
        </div>
        {{offices}}
        <iframe class="map-frame" title="Bản đồ xưởng 3DRoom tại Hà Nội" src="https://www.google.com/maps?q=Nguy%E1%BB%85n%20Ch%C3%AD%20Thanh%2C%20L%C3%A1ng%2C%20H%C3%A0%20N%E1%BB%99i&amp;output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </section>
